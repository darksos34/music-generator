name: Deploy Vite to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    # DEZE VARIABELE IS HIER VEREIST VOOR DE "OUDE" STABIELE SETUP
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # Gebruik v4 (stabiel, veel gebruikt)
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Node (voor je build proces)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Of 24, maar 20 was de standaard voor deze setup
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Gebruik v3 (Dit is de versie die het langst stabiel bleef)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # Gebruik v4 (Stabiele deploy versie)
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4