name: Deploy Vite to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    # GEEN env variabelen meer nodig!

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm' # Dit vervangt vaak de aparte cache stap voor npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # ⚠️ DE OPLOSSING: Update van v3 naar v4
      # v3 is gebouwd voor Node 20 en veroorzaakt je waarschuwing.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5